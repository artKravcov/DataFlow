name: dataflow

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init-test-database.sh:/docker-entrypoint-initdb.d/10-create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [dataflow]

  redis:
    image: redis:8.10.1-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [dataflow]

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: ${FILESYSTEM_DISK}
      MAX_INPUT_BYTES: ${MAX_INPUT_BYTES}
      MAX_EXECUTION_SECONDS: ${MAX_EXECUTION_SECONDS}
      DATAFLOW_DEMO_ADMIN_EMAIL: ${DATAFLOW_DEMO_ADMIN_EMAIL:-}
      DATAFLOW_DEMO_PASSWORD: ${DATAFLOW_DEMO_PASSWORD:-}
    volumes:
      - app_files:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks: [dataflow]

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [dataflow]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker/Dockerfile
    restart: "no"
    networks: [dataflow]

  gateway:
    image: nginx:1.31.4-trixie
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [dataflow]

volumes:
  postgres_data:
  redis_data:
  app_files:

networks:
  dataflow:
    driver: bridge
